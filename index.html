<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2A3C">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Shahid App</title>
<style>
:root{--ink:#0B2A3C;--teal:#0E7C86;--foam:#EEF6F6;--paper:#FBFDFD;--line:#D3E3E5;--mute:#5A727D;--red:#D93F3F;--amber:#D98200;--green:#2A9158;--blue:#3A6EA5;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--foam);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
header.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
header.top button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;width:44px;height:44px;font-size:22px}
main{padding:14px 14px 150px;max-width:720px;margin:0 auto}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bar a,nav.bar button{background:none;border:0;padding:8px 2px 7px;font:600 12px system-ui;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;position:relative}
nav.bar .ic{font-size:21px;line-height:1}
nav.bar .on{color:var(--teal)}
nav.bar .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;width:60px;height:60px;border-radius:50%;background:var(--teal);color:#fff;border:0;font-size:32px;box-shadow:0 6px 18px rgba(11,42,60,.35)}
h2{font-size:18px;margin:18px 0 8px}
h2 small{color:var(--mute);font-weight:500;font-size:14px}
.brief{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.big{border-radius:var(--r);padding:16px;color:#fff;display:block;min-height:112px}
.big b{display:block;font-size:46px;line-height:1;font-weight:800}
.big span{display:block;margin-top:8px;font-weight:600}
.big.today{background:var(--teal)}
.big.over{background:var(--red)}
.big.over.zero{background:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-size:12.5px;color:var(--mute);min-height:74px}
.tile b{display:block;font-size:24px;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .name{font-weight:700;font-size:17px}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
.remark{margin:8px 0;padding:8px 10px;background:var(--foam);border-radius:10px;font-size:14.5px}
.when{font-weight:700;font-size:14px;margin:6px 0}
.when.over{color:var(--red)}.when.today{color:var(--teal)}.when.none{color:var(--mute);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tag,.tagchip{--tc:#5F6B73;border:1.5px solid var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,#fff);border-radius:20px;padding:2px 9px;font-size:13px;font-weight:600;white-space:nowrap}
.tagchip{font-family:inherit;padding:8px 12px;font-size:14px;background:#fff}
.tagchip.on{background:var(--tc);color:#fff}
.pri{font-size:12.5px;font-weight:700;border-radius:8px;padding:2px 9px;color:#fff}
.pri.hot{background:var(--red)}.pri.warm{background:var(--amber)}.pri.cold{background:var(--blue)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.acts.two{grid-template-columns:repeat(2,1fr)}
.btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;min-height:46px;font:600 15px system-ui;padding:8px 6px;display:flex;align-items:center;justify-content:center;gap:5px;text-align:center}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.good{background:var(--green);border-color:var(--green);color:#fff}
.btn.warn{color:var(--red);border-color:#f0c4c4}
.btn.big{width:100%;min-height:54px;font-size:17px;margin-top:14px}
.btn.sm{min-height:40px;font-size:14px;padding:6px 12px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
input,select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:16px system-ui;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.seg{display:flex;gap:6px}.seg.wrap{flex-wrap:wrap}
.seg button,.qchip{flex:1;min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font:600 14.5px system-ui;color:var(--ink);padding:6px 10px}
.seg.wrap button{flex:0 0 auto}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button.on.hot{background:var(--red);border-color:var(--red)}.seg button.on.warm{background:var(--amber);border-color:var(--amber)}.seg button.on.cold{background:var(--blue);border-color:var(--blue)}
.qrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.qchip{flex:0 0 auto;min-height:36px;font-size:13px;padding:4px 11px;background:var(--foam)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.chips .tagchip,.chips .qchip{flex:0 0 auto}
.sheet-bg{position:fixed;inset:0;background:rgba(11,42,60,.55);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--paper);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.sheet h2{margin-top:0}
.hist{border-left:3px solid var(--line);margin-left:6px;padding-left:14px}
.he{position:relative;margin-bottom:14px}
.he:before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--teal);border:2px solid var(--foam)}
.he.sale:before{background:var(--green)}.he.reschedule:before{background:var(--amber)}.he.created:before{background:var(--mute)}
.he .h{font-weight:700;font-size:14px}.he .d{color:var(--mute);font-size:12.5px}.he p{margin:3px 0;font-size:14.5px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:12px;color:var(--mute);font-weight:600}
.cal button{aspect-ratio:1/1;border:1px solid var(--line);background:#fff;border-radius:10px;font:600 15px system-ui;color:var(--ink);position:relative;padding:0}
.cal button.td{border-color:var(--teal);border-width:2px}
.cal button.sel{background:var(--ink);color:#fff}
.cal button i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;background:var(--teal);color:#fff;border-radius:8px;padding:0 5px}
.cal button i.o{background:var(--red)}
.cal button.blank{visibility:hidden}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:30px}.stat span{color:var(--mute);font-size:14px}
.empty{text-align:center;color:var(--mute);padding:26px 10px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.note{font-size:13px;color:var(--mute);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.warnbox{background:#FFF4E0;border:1px solid #F0D49A;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:90;font-weight:600;max-width:90vw}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.tog{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:50px;margin-top:8px}
.tog input{width:24px;min-height:24px;flex:none}
.hide{display:none!important}
.menu a{display:flex;gap:12px;align-items:center;padding:14px 6px;border-bottom:1px solid var(--line);font-weight:600;font-size:17px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s}@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}}

#gate{position:fixed;inset:0;z-index:100;background:var(--foam);overflow:auto;padding:max(18px,env(safe-area-inset-top)) 16px 30px}
#gate .in{max-width:440px;margin:0 auto}
.plan{display:flex;justify-content:space-between;align-items:center;gap:10px}
.plan b{font-size:20px}.plan .btn{flex:0 0 90px}
.toast{z-index:130}
</style>
</head>
<body>
<header class="top"><h1 id="title">Shahid App</h1><button id="menuBtn" aria-label="Menu">☰</button></header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Add customer">＋</button>
<nav class="bar" id="bar"></nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- constants ---------- */
const BASE_TAGS=[['🔥 Hot Lead','#C62828'],['🟠 Interested','#C2570C'],['💰 Price Issue','#9A6B00'],['👨‍👩‍👦 Family Discussion','#7B3FA0'],['📞 Call Back','#1E5FA8'],['📅 Month-End Purchase','#0E7C86'],['🛍️ Ready to Buy','#1F7A45'],['💧 Product Demonstration','#0B7285'],['⏳ Purchase Postponed','#6D5A3C'],['📵 No Response','#5F6B73'],['🏆 Sale Completed','#8A6D00'],['❌ Lost Customer','#8C1D1D']];
const CUSTOM_COLORS=['#AD1457','#00695C','#4527A0','#2E7D32','#EF6C00','#37474F'];
const T_HOT='🔥 Hot Lead',T_SALE='🏆 Sale Completed',T_LOST='❌ Lost Customer';
const STATUSES=['New Inquiry','Contacted','Negotiating','Sale Done','Lost'];
const PRIS=['Hot','Warm','Cold'];
const ZONES=['Asia/Kuwait','Asia/Riyadh','Asia/Dubai','Asia/Qatar','Asia/Bahrain','Asia/Muscat','Asia/Baghdad','Asia/Karachi','Asia/Kolkata','Asia/Dhaka','Africa/Cairo','Asia/Manila','Europe/London','UTC'];
const DEFAULTS={tz:'Asia/Kuwait',cc:'965',remindBefore:10,notify:false,overdueAlert:true,customTags:[],counter:0,lastBackup:0};

const S={customers:[],map:new Map(),settings:{...DEFAULTS},fired:{},ui:{filterPri:'',filterTags:[],q:'',special:'',calMonth:'',calSel:''}};

/* ---------- IndexedDB ---------- */
let db;
function openDB(n){return new Promise((res,rej)=>{const r=indexedDB.open(n||'shahid-app',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('customers',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const store=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
async function metaGet(k){const r=await rq(store('meta').get(k));return r?r.v:undefined;}
const metaSet=(k,v)=>rq(store('meta','readwrite').put({k,v}));
async function saveCustomer(c){c.updatedAt=Date.now();await rq(store('customers','readwrite').put(c));cloudPut(c);const i=S.customers.findIndex(x=>x.id===c.id);if(i>=0)S.customers[i]=c;else S.customers.push(c);S.map.set(c.id,c);}
const saveSettings=()=>{cloudSettings();return metaSet('settings',S.settings);};

/* ---------- time (all calculations in the chosen time zone) ---------- */
const TZ=()=>S.settings.tz;
function parts(ts,tz=TZ()){const f=new Intl.DateTimeFormat('en-CA',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});const o={};f.formatToParts(new Date(ts)).forEach(p=>o[p.type]=p.value);return o;}
function tzOffset(ts,tz){const p=parts(ts,tz);return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute)-Math.floor(ts/60000)*60000;}
function toTs(date,time,tz=TZ()){const[y,m,d]=date.split('-').map(Number);const[h,mi]=(time||'09:00').split(':').map(Number);const g=Date.UTC(y,m-1,d,h,mi);let t=g-tzOffset(g,tz);t=g-tzOffset(t,tz);return t;}
const todayStr=(now=Date.now())=>{const p=parts(now);return`${p.year}-${p.month}-${p.day}`;};
const nowLocal=()=>{const p=parts(Date.now());return`${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;};
const addDays=(ds,n)=>{const[y,m,d]=ds.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10);};
const monthEnd=ds=>{const[y,m]=ds.split('-').map(Number);return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);};
const fmtDate=ds=>ds?new Date(ds+'T00:00:00Z').toLocaleDateString('en-GB',{timeZone:'UTC',weekday:'short',day:'numeric',month:'short',year:'numeric'}):'';
const fmtTime=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return`${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;};
const fmtLocalStr=s=>{if(!s)return'';const[d,t]=s.split('T');return fmtDate(d)+(t?', '+fmtTime(t):'');};
const ago=ms=>{const m=Math.max(1,Math.floor(ms/60000));if(m<60)return m+' min';const h=Math.floor(m/60);if(h<24)return h+' h';return Math.floor(h/24)+' d';};

/* ---------- tags ---------- */
const allTags=()=>[...BASE_TAGS.map(t=>t[0]),...S.settings.customTags.map(t=>t.name)];
function tagColor(n){const b=BASE_TAGS.find(t=>t[0]===n);if(b)return b[1];const c=S.settings.customTags.find(t=>t.name===n);return c?c.color:'#5F6B73';}
const tagHTML=n=>`<span class="tag" style="--tc:${tagColor(n)}">${esc(n)}</span>`;
const tagsHTML=a=>a&&a.length?`<div class="tags">${a.map(tagHTML).join('')}</div>`:'';
const tagPicker=(sel,id)=>`<div class="chips" id="${id}" style="flex-wrap:wrap;overflow:visible">${allTags().map(n=>`<button type="button" class="tagchip ${sel.includes(n)?'on':''}" style="--tc:${tagColor(n)}" data-tag="${esc(n)}">${esc(n)}</button>`).join('')}<button type="button" class="qchip" data-act="newtag" data-target="${id}">＋ New tag</button></div>`;
const pickedTags=id=>$$('.tagchip.on',$('#'+id)).map(b=>b.dataset.tag);
function addCustomTag(name){name=name.trim();if(!name)return null;if(allTags().some(t=>t.toLowerCase()===name.toLowerCase()))return allTags().find(t=>t.toLowerCase()===name.toLowerCase());const color=CUSTOM_COLORS[S.settings.customTags.length%CUSTOM_COLORS.length];S.settings.customTags.push({name,color});saveSettings();return name;}

/* ---------- classification ---------- */
const isOpen=c=>c.status!=='Sale Done'&&c.status!=='Lost';
const hasFU=c=>isOpen(c)&&!!c.fuDate;
const dueTs=c=>toTs(c.fuDate,c.fuTime);
function cat(c){if(!hasFU(c))return null;if(dueTs(c)<Date.now())return'overdue';return c.fuDate===todayStr()?'today':'upcoming';}
const priRank=p=>({Hot:0,Warm:1,Cold:2}[p]??3);
function lists(){const L={today:[],overdue:[],upcoming:[],hot:[],fresh:[],nofu:[],sales:[],lost:[]};
for(const c of S.customers){const k=cat(c);if(k)L[k].push(c);
if(isOpen(c)&&c.priority==='Hot')L.hot.push(c);
if(c.status==='New Inquiry')L.fresh.push(c);
if(isOpen(c)&&!c.fuDate)L.nofu.push(c);
if(c.status==='Sale Done')L.sales.push(c);
if(c.status==='Lost')L.lost.push(c);}
L.today.sort((a,b)=>dueTs(a)-dueTs(b)||priRank(a.priority)-priRank(b.priority));
L.overdue.sort((a,b)=>dueTs(a)-dueTs(b)||priRank(a.priority)-priRank(b.priority));
L.upcoming.sort((a,b)=>dueTs(a)-dueTs(b));
return L;}

/* ---------- phone helpers ---------- */
const digits=s=>String(s||'').replace(/\D/g,'');
const norm=s=>digits(s).slice(-8);
function waLink(c){let d=digits(c.whatsapp||c.mobile);if(d.length<7)return null;if(d.length<=8)d=S.settings.cc+d;return'https://wa.me/'+d;}
const telLink=c=>'tel:'+String(c.mobile).replace(/[^\d+]/g,'');

/* ---------- UI atoms ---------- */
function toast(msg){$$('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function openSheet(html){closeSheet();const s=document.createElement('div');s.className='sheet-bg';s.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;s.addEventListener('click',e=>{if(e.target===s)closeSheet();});document.body.appendChild(s);document.body.classList.add('lock');}
function closeSheet(){$$('.sheet-bg').forEach(x=>x.remove());document.body.classList.remove('lock');}
const priPill=p=>`<span class="pri ${String(p).toLowerCase()}">${esc(p)}</span>`;

function whenHTML(c){if(!isOpen(c))return`<div class="when none">${esc(c.status)}</div>`;if(!c.fuDate)return'<div class="when none">No follow-up scheduled</div>';const k=cat(c);const t=`${fmtDate(c.fuDate)}, ${fmtTime(c.fuTime)}`;
if(k==='overdue')return`<div class="when over">⚠ Missed: ${t} · ${ago(Date.now()-dueTs(c))} ago</div>`;
if(k==='today')return`<div class="when today">Today at ${fmtTime(c.fuTime)}</div>`;
return`<div class="when">Next: ${t}</div>`;}

function cardHTML(c,mode='full'){
const wa=waLink(c);
let acts='';
if(mode==='full')acts=`<div class="acts">
<button class="btn primary" data-act="call" data-id="${c.id}">📞 Call</button>
<button class="btn ${wa?'good':''}" data-act="wa" data-id="${c.id}">💬 WhatsApp</button>
<button class="btn" data-act="remark" data-id="${c.id}">📝 Remark</button>
<button class="btn" data-act="resched" data-id="${c.id}">🗓 Reschedule</button>
<button class="btn" data-act="complete" data-id="${c.id}">✔ Completed</button>
<button class="btn good" data-act="sale" data-id="${c.id}">🏆 Sale Done</button></div>`;
else if(mode==='lite')acts=`<div class="acts">
<button class="btn primary" data-act="call" data-id="${c.id}">📞 Call</button>
<button class="btn" data-act="wa" data-id="${c.id}">💬 WhatsApp</button>
<button class="btn" data-act="complete" data-id="${c.id}">✔ Completed</button></div>`;
else acts=`<div class="acts two"><button class="btn primary sm" data-act="call" data-id="${c.id}">📞 Call</button><button class="btn sm" data-act="wa" data-id="${c.id}">💬 WhatsApp</button></div>`;
return`<div class="card"><div class="top"><div><a class="name" href="#/c/${c.id}">${esc(c.name)}</a><div class="sub">${esc(c.mobile)}${c.product?' · '+esc(c.product):''}${c.location?' · '+esc(c.location):''}</div></div>${priPill(c.priority)}</div>
${tagsHTML(c.tags)}${whenHTML(c)}${c.remark?`<div class="remark">${esc(c.remark)}</div>`:''}${acts}</div>`;}
const listHTML=(a,mode,empty)=>a.length?a.map(c=>cardHTML(c,mode)).join(''):`<div class="empty">${empty}</div>`;

/* ---------- views ---------- */
const VIEWS={};
VIEWS.home=()=>{const L=lists();const s=S.settings;
const backupNag=S.customers.length&&(Date.now()-s.lastBackup>14*864e5)?`<div class="note">No backup in the last 14 days. <a href="#/settings" style="color:var(--teal);font-weight:700">Back up now</a></div>`:'';
return`<div class="brief"><a class="big today" href="#/today"><b>${L.today.length}</b><span>Call today</span></a><a class="big over ${L.overdue.length?'':'zero'}" href="#/overdue"><b>${L.overdue.length}</b><span>${L.overdue.length?'Missed – call now':'Missed. All clear'}</span></a></div>

/* ---------- notifications ---------- */
async function notify(title,body,tag){if(!('Notification' in window)||Notification.permission!=='granted')return false;
try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg){await reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png'});return true;}new Notification(title,{body,tag,icon:'icon-192.png'});return true;}catch(e){return false;}}
async function checkReminders(){const s=S.settings;if(!s.notify||!('Notification' in window)||Notification.permission!=='granted')return;const now=Date.now();let dirty=false;
for(const c of S.customers){if(!hasFU(c))continue;const due=dueTs(c),base=`${c.id}|${c.fuDate}|${c.fuTime}`;const t=fmtTime(c.fuTime);
const fire=async(k,title,body)=>{if(S.fired[k])return;S.fired[k]=now;dirty=true;await notify(title,body,k);};
if(s.remindBefore>0&&now>=due-s.remindBefore*6e4&&now<due)await fire(base+'|pre',`Call ${c.name} in ${s.remindBefore} min`,`${t} · ${c.remark||c.product||''}`.slice(0,120));
if(now>=due&&now<due+36e5)await fire(base+'|due',`Call ${c.name} now`,`${t} · ${c.remark||c.product||''}`.slice(0,120));
if(s.overdueAlert&&now>=due+18e5&&now<due+432e5)await fire(base+'|over',`Missed: ${c.name}`,`Scheduled ${t}. Call or reschedule.`);}
if(dirty){const k=Object.keys(S.fired);if(k.length>500)k.sort((a,b)=>S.fired[a]-S.fired[b]).slice(0,k.length-300).forEach(x=>delete S.fired[x]);await metaSet('fired',S.fired);}}

case'oldimport':legacyImport(true);break;
case'admext':{const n=+$('#d-'+a.dataset.uid).value;if(!n){toast('Enter number of days');break;}admSet(a.dataset.uid,u=>({trialEnd:Math.max(Date.now(),u.trialEnd||0)+n*864e5}));break;}
case'admplan':{const m=+$('#p-'+a.dataset.uid).value;admSet(a.dataset.uid,u=>{const d=new Date(Math.max(Date.now(),u.paidUntil||0));d.setMonth(d.getMonth()+m);return{paidUntil:d.getTime()};});break;}
case'admunl':admSet(a.dataset.uid,u=>({trialEnd:new Date('2100-01-01').getTime()}));break;
case'csv':exportCSV();break;case'csvh':exportHist();break;case'backup':backup();break;
case'delete':if(confirm(`Delete ${c.name} and all their remarks?\nThis cannot be undone. A backup is recommended first.`)){await rq(store('customers','readwrite').delete(id));cloudDel(id);S.customers=S.customers.filter(x=>x.id!==id);S.map.delete(id);toast('Customer deleted');location.hash='#/customers';}break;
case'testnotify':{if(!('Notification' in window)){toast('This browser does not support notifications');break;}if(Notification.permission!=='granted'){const p=await Notification.requestPermission();if(p!=='granted'){toast('Notification permission was not granted');render(true);break;}}const ok=await notify('Shahid App','Test notification. If you can see this, reminders can reach you.','test');toast(ok?'Test sent. Check your notification shade':'Could not show a notification');render(true);break;}
case'sample':{S.settings.counter++;await saveSettings();const s={id:'SA-'+String(S.settings.counter).padStart(4,'0'),createdAt:Date.now(),name:'Ahmed',mobile:'12345678',whatsapp:'',location:'Kuwait City',product:'Water Purifier',inquiryDate:todayStr(),price:'',priority:'Hot',tags:[T_HOT,'🟠 Interested','👨‍👩‍👦 Family Discussion'],remark:'Interested but wants to discuss the price with his family.',status:'Contacted',fuDate:'2026-10-12',fuTime:'11:00',fuNote:'Ask about family decision',history:[]};s.history.push({id:uid(),type:'created',ts:Date.now(),remark:s.remark,tags:[...s.tags],nextDate:s.fuDate,nextTime:s.fuTime});await saveCustomer(s);toast('Sample customer added');break;}
}});
document.addEventListener('input',e=>{
if(e.target.id==='adm-q'){const q=e.target.value.toLowerCase();$$('.adm').forEach(x=>x.classList.toggle('hide',!x.dataset.s.includes(q)));}
if(e.target.id==='q'){S.ui.q=e.target.value;S.ui.special='';const r=VIEWS.customers();const tmp=document.createElement('div');tmp.innerHTML=r;$('#results').innerHTML=$('#results',tmp).innerHTML;}
if(e.target.id==='f-mobile'){const v=e.target.value,id=$('#cform').dataset.id;const d=norm(v).length>=6&&S.customers.find(c=>c.id!==id&&norm(c.mobile)===norm(v));$('#dupnote').innerHTML=d?`<div class="warnbox">⚠ This number already belongs to <b>${esc(d.name)}</b> (${esc(d.id)}).</div>`:'';}});
document.addEventListener('change',async e=>{const t=e.target,s=S.settings;
if(t.id==='s-tz'){s.tz=t.value;await saveSettings();toast('Time zone: '+t.value);render(true);}
if(t.id==='s-cc'){s.cc=digits(t.value)||'965';await saveSettings();}
if(t.id==='s-before'){s.remindBefore=+t.value;await saveSettings();}
if(t.id==='s-over'){s.overdueAlert=t.checked;await saveSettings();}
if(t.id==='s-notify'){if(t.checked){if(!('Notification' in window)){toast('Notifications are not supported here');t.checked=false;return;}const p=Notification.permission==='granted'?'granted':await Notification.requestPermission();s.notify=p==='granted';if(p!=='granted'){t.checked=false;toast('Permission was not granted. Allow notifications in Android settings');}}else s.notify=false;await saveSettings();render(true);}
if(t.id==='restore'&&t.files[0]){await restore(t.files[0]);t.value='';}});

/* ---------- init ---------- */
async function loadAll(){S.customers=await rq(store('customers').getAll());S.map=new Map(S.customers.map(c=>[c.id,c]));S.fired=(await metaGet('fired'))||{};}
async function startApp(){
try{db=await openDB('shahid-app-'+U.uid);}catch(e){$('#app').innerHTML='<div class="empty">This browser blocked local storage, so Shahid App cannot save data. Open it in Chrome and turn off private mode.</div>';return;}
S.settings={...DEFAULTS,...((await metaGet('settings'))||{})};await loadAll();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();checkReminders();startCloud();if(window._tm)return;window._tm=1;
setInterval(()=>{checkReminders();if(!$('.sheet-bg')&&['home','today','overdue','calendar'].includes(route().name)&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render(true);},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();if(!$('.sheet-bg')&&['home','today','overdue','calendar'].includes(route().name))render(true);}});}
function boot(){
if(typeof firebase==='undefined'||!CFG.firebase.apiKey){showAuth('in',typeof firebase==='undefined'?'Internet is needed for the first login.':'');return;}
firebase.initializeApp(CFG.firebase);auth=firebase.auth();fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
auth.onAuthStateChanged(async u=>{
if(!u){stopCloud();U=null;P=null;db=null;S.customers=[];S.map=new Map();showAuth('in');return;}
U=u;if(window._suP)await window._suP;
try{const d=await fs.collection('users').doc(u.uid).get();P=d.exists?d.data():null;}catch(e){P=null;}
if(!P){showAuth('in','Could not load your profile. Check internet and login again.');auth.signOut();return;}
await startApp();await legacyImport();});}
boot();
</script>
